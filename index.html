<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Login Screen -->
  <div id="login_screen">
    <div id="login_box">
      <h2 style="margin-bottom: .1rem;">Login</h2>
      <h4 style="margin-top: .1rem;">Or create an account</h4>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button id="forgot_btn">Forgot Password?</button>
      <button id="login_btn">Login</button>
      <button id="register_btn">Register</button>
      <p id="auth_error"></p>
    </div>
  </div>

  <!-- App Screen -->
  <div id="app_screen" class="hidden">

    <div class="header">
      <h3>My tasks</h3>
      <span>
        <input type="text" id="search" placeholder="Search tasks...">
      </span>

      <span>
        <button id="add_btn"> + Add Task</button>
      </span>

      <span id="total_completed">Total Completed: </span>
      <button id="logout_btn">Logout</button>
    </div>

    <div id="modal" style="display: none;">
      <div id="modal_content">
        <h2 id="modal_title"></h2>
        <h2 id="modal_due_date"></h2>
        <p id="modal_description"></p>
        <button id="modal_close">Close</button> 
      </div>
    </div>

    <ul id="task_list"></ul>

  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="task.js"></script>
  <script type="module" src="tasklist.js"></script>
  <script type="module" src="run.js"></script>

</body>

</html>
